name: CPU contracts
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python run.py synthetic --output runs/ci-cpu-check
      - run: python run_bench.py synthetic --output runs/ci-multibench-check
